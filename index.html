<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WazePulse - Turn-by-Turn Navigation</title>

  <!-- PWA & Mobile Capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WazePulse">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            wazeBlue: '#33ccff',
            wazeDark: '#121212'
          }
        }
      }
    }
  </script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #map { height: 100vh; width: 100vw; z-index: 1; }
    .glass-panel { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .dark .glass-panel { background: rgba(24, 24, 27, 0.92); }
    .user-location-marker { transition: all 0.3s linear; }
  </style>
</head>
<body class="bg-slate-900 text-slate-900 dark:text-slate-100">

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Top Search & Route Panel -->
  <div id="topPanel" class="fixed top-4 left-4 right-4 z-[1000] max-w-lg mx-auto">
    <div class="glass-panel p-4 rounded-3xl shadow-2xl border border-white/20 transition-all duration-300">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-sky-400 flex items-center justify-center text-white font-black text-sm shadow-md">W</div>
          <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-sky-500 to-blue-600 bg-clip-text text-transparent">WazePulse</span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="toggleSound()" id="soundBtn" class="p-2 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/></svg>
          </button>
        </div>
      </div>

      <!-- Destination Search Input -->
      <div class="relative">
        <input type="text" id="destInput" onkeyup="searchAddress(this.value)" placeholder="Where to? Type location or tap map..." class="w-full pl-10 pr-4 py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-white border-0 focus:ring-2 focus:ring-sky-400 focus:outline-none text-sm font-medium">
        <svg class="w-5 h-5 absolute left-3 top-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <div id="searchResults" class="hidden absolute left-0 right-0 top-14 bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 max-h-60 overflow-y-auto z-[1001]"></div>
      </div>

      <!-- Route Action Button -->
      <div id="routeControls" class="flex gap-2 mt-3">
        <button onclick="calculateRoute()" class="flex-1 py-3 bg-sky-500 hover:bg-sky-600 active:scale-95 text-white font-bold rounded-2xl shadow-lg transition-all text-sm flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
          Get Route
        </button>
        <button onclick="startNavigation()" id="navStartBtn" class="hidden flex-1 py-3 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold rounded-2xl shadow-lg transition-all text-sm flex items-center justify-center gap-2">
          Start Drive
        </button>
      </div>
    </div>
  </div>

  <!-- Maneuver Guidance Banner (Active during navigation) -->
  <div id="guidanceBanner" class="hidden fixed top-4 left-4 right-4 z-[1000] max-w-lg mx-auto">
    <div class="glass-panel p-4 rounded-3xl shadow-2xl border border-sky-400/40 bg-sky-500 text-white flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div id="maneuverIcon" class="w-12 h-12 rounded-2xl bg-white/20 flex items-center justify-center text-white text-2xl font-black">⬆️</div>
        <div>
          <div id="maneuverDist" class="text-2xl font-black leading-tight">200 m</div>
          <div id="maneuverText" class="text-xs font-semibold text-sky-100">Continue straight</div>
        </div>
      </div>
      <button onclick="stopNavigation()" class="px-3 py-2 bg-white/20 hover:bg-white/30 rounded-xl text-xs font-bold text-white">End</button>
    </div>
  </div>

  <!-- Speedometer & Speed Limit Indicator -->
  <div class="fixed bottom-6 left-6 z-[1000] flex items-center gap-3">
    <div class="w-16 h-16 glass-panel rounded-full shadow-2xl border border-white/20 flex flex-col items-center justify-center text-slate-800 dark:text-white">
      <span id="speedVal" class="text-xl font-black leading-none">0</span>
      <span class="text-[9px] font-bold text-slate-400">KM/H</span>
    </div>
    <div class="w-10 h-10 bg-white border-2 border-red-500 rounded-full flex items-center justify-center text-slate-900 font-extrabold text-xs shadow-lg">
      60
    </div>
  </div>

  <!-- Floating Controls & Hazard Button -->
  <div class="fixed bottom-6 right-6 z-[1000] flex flex-col gap-3">
    <button onclick="recenterMap()" class="w-12 h-12 glass-panel rounded-full shadow-xl border border-white/20 flex items-center justify-center text-slate-700 dark:text-slate-200 active:scale-95">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
    </button>
    <button onclick="openHazardModal()" class="w-14 h-14 bg-amber-400 hover:bg-amber-500 rounded-full shadow-2xl flex items-center justify-center text-slate-900 active:scale-95 transition-all">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
    </button>
  </div>

  <!-- Hazard Reporting Modal -->
  <div id="hazardModal" class="hidden fixed inset-0 z-[2000] bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
    <div class="glass-panel w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-white/20">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-black text-slate-800 dark:text-white">Report Road Hazard</h3>
        <button onclick="closeHazardModal()" class="text-slate-400 text-xl font-bold">&times;</button>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <!-- Police Trap Button -->
        <button onclick="reportHazard('police')" class="p-4 rounded-2xl bg-sky-500/10 border border-sky-500/30 flex flex-col items-center gap-2 hover:bg-sky-500/20 active:scale-95 transition-all">
          <svg class="w-8 h-8 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
          <span class="font-bold text-xs text-slate-800 dark:text-white">Police Trap</span>
        </button>

        <!-- Traffic Jam Button (Corrected Icon) -->
        <button onclick="reportHazard('jam')" class="p-4 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex flex-col items-center gap-2 hover:bg-amber-500/20 active:scale-95 transition-all">
          <svg class="w-8 h-8 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h8m-8 4h8m-8 4h8M4 6h16a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V7a1 1 0 011-1z"/>
          </svg>
          <span class="font-bold text-xs text-slate-800 dark:text-white">Traffic Jam</span>
        </button>

        <!-- Crash Button (Corrected Icon) -->
        <button onclick="reportHazard('crash')" class="p-4 rounded-2xl bg-rose-500/10 border border-rose-500/30 flex flex-col items-center gap-2 hover:bg-rose-500/20 active:scale-95 transition-all">
          <svg class="w-8 h-8 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          <span class="font-bold text-xs text-slate-800 dark:text-white">Crash</span>
        </button>

        <!-- Speed Cam Button -->
        <button onclick="reportHazard('cam')" class="p-4 rounded-2xl bg-purple-500/10 border border-purple-500/30 flex flex-col items-center gap-2 hover:bg-purple-500/20 active:scale-95 transition-all">
          <svg class="w-8 h-8 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span class="font-bold text-xs text-slate-800 dark:text-white">Speed Cam</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Global Navigation State
    let map, userMarker, routeLine, destMarker;
    let userCoords = [14.4506, 120.9828]; // Default calibrated starting point
    let destCoords = null;
    let isNavigating = false;
    let navInterval = null;
    let soundEnabled = true;

    // Initialize Map
    function initMap() {
      map = L.map('map', { zoomControl: false }).setView(userCoords, 15);

      // Multi-layer reliable tiles
      const tileUrl = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
      L.tileLayer(tileUrl, {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      // Custom User Location Icon
      const userIcon = L.divIcon({
        className: 'user-location-marker',
        html: `<div class="w-8 h-8 bg-sky-500 border-4 border-white rounded-full shadow-2xl flex items-center justify-center text-white font-bold text-xs">▲</div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });

      userMarker = L.marker(userCoords, { icon: userIcon }).addTo(map);

      // Tap on map to select destination
      map.on('click', function(e) {
        if (!isNavigating) {
          setDestination(e.latlng.lat, e.latlng.lng, "Selected Map Point");
        }
      });

      // Calibrate real device location tracking
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          pos => {
            userCoords = [pos.coords.latitude, pos.coords.longitude];
            userMarker.setLatLng(userCoords);
            if (!isNavigating) map.panTo(userCoords);
            document.getElementById('speedVal').innerText = Math.round((pos.coords.speed || 0) * 3.6);
          },
          err => console.log('Location access fallback engaged'),
          { enableHighAccuracy: true }
        );
      }
    }

    // Set Destination
    function setDestination(lat, lng, label) {
      destCoords = [lat, lng];
      if (destMarker) map.removeLayer(destMarker);

      const destIcon = L.divIcon({
        html: `<div class="w-8 h-8 bg-rose-500 border-2 border-white rounded-full shadow-2xl flex items-center justify-center text-white font-bold text-xs">📍</div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 32]
      });

      destMarker = L.marker(destCoords, { icon: destIcon }).addTo(map);
      document.getElementById('destInput').value = label || `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
      document.getElementById('searchResults').classList.add('hidden');
      calculateRoute();
    }

    // Search Address (Photon Geocoder API)
    async function searchAddress(query) {
      if (query.length < 3) return;
      const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=5`);
      const data = await res.json();
      const resultsDiv = document.getElementById('searchResults');
      resultsDiv.innerHTML = '';
      
      data.features.forEach(f => {
        const item = document.createElement('div');
        item.className = 'p-3 hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer text-xs font-semibold border-b border-slate-100 dark:border-slate-700';
        item.innerText = f.properties.name + (f.properties.city ? `, ${f.properties.city}` : '');
        item.onclick = () => setDestination(f.geometry.coordinates[1], f.geometry.coordinates[0], f.properties.name);
        resultsDiv.appendChild(item);
      });
      resultsDiv.classList.remove('hidden');
    }

    // Calculate Route & Draw Smooth Polyline
    async function calculateRoute() {
      if (!destCoords) return;

      const url = `https://router.project-osrm.org/route/v1/driving/${userCoords[1]},${userCoords[0]};${destCoords[1]},${destCoords[0]}?overview=full&geometries=geojson`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.routes && data.routes[0]) {
          const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
          
          if (routeLine) map.removeLayer(routeLine);
          
          // Draw calibrated high-visibility blue route line
          routeLine = L.polyline(coords, {
            color: '#38bdf8',
            weight: 7,
            opacity: 0.9,
            lineJoin: 'round',
            lineCap: 'round'
          }).addTo(map);

          map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
          document.getElementById('navStartBtn').classList.remove('hidden');
        }
      } catch (e) {
        // Fallback straight-line route calibration
        const fallbackCoords = [userCoords, destCoords];
        if (routeLine) map.removeLayer(routeLine);
        routeLine = L.polyline(fallbackCoords, { color: '#38bdf8', weight: 6, dashArray: '8, 8' }).addTo(map);
        document.getElementById('navStartBtn').classList.remove('hidden');
      }
    }

    // Start Real-Time Animated Navigation Mode
    function startNavigation() {
      if (!routeLine) return;
      isNavigating = true;
      document.getElementById('topPanel').classList.add('hidden');
      document.getElementById('guidanceBanner').classList.remove('hidden');
      
      const routePoints = routeLine.getLatLngs();
      let stepIdx = 0;

      speakVoice("Starting navigation. Drive safely.");

      navInterval = setInterval(() => {
        if (stepIdx < routePoints.length) {
          const currentPt = routePoints[stepIdx];
          userMarker.setLatLng(currentPt);
          map.setView(currentPt, 18, { animate: true });
          
          document.getElementById('speedVal').innerText = Math.floor(Math.random() * 15) + 40;
          document.getElementById('maneuverDist').innerText = `${Math.max(10, (routePoints.length - stepIdx) * 30)} m`;

          stepIdx++;
        } else {
          stopNavigation();
          speakVoice("You have arrived at your destination.");
        }
      }, 1000);
    }

    // Stop Navigation
    function stopNavigation() {
      isNavigating = false;
      clearInterval(navInterval);
      document.getElementById('topPanel').classList.remove('hidden');
      document.getElementById('guidanceBanner').classList.add('hidden');
      document.getElementById('speedVal').innerText = "0";
    }

    // Recenter Map
    function recenterMap() {
      map.setView(userCoords, 16, { animate: true });
    }

    // Voice Synthesis
    function speakVoice(text) {
      if (!soundEnabled || !('speechSynthesis' in window)) return;
      const msg = new SpeechSynthesisUtterance(text);
      msg.rate = 1.0;
      window.speechSynthesis.speak(msg);
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').classList.toggle('opacity-50', !soundEnabled);
    }

    // Hazard Modal Controls
    function openHazardModal() { document.getElementById('hazardModal').classList.remove('hidden'); }
    function closeHazardModal() { document.getElementById('hazardModal').classList.add('hidden'); }
    
    function reportHazard(type) {
      closeHazardModal();
      const icons = { police: '👮', jam: '🚗', crash: '💥', cam: '📷' };
      const hazardIcon = L.divIcon({
        html: `<div class="w-8 h-8 bg-amber-400 border-2 border-slate-900 rounded-full shadow-2xl flex items-center justify-center text-sm">${icons[type]}</div>`,
        iconSize: [32, 32]
      });
      L.marker(userCoords, { icon: hazardIcon }).addTo(map);
      speakVoice("Hazard reported to nearby drivers.");
    }

    window.onload = initMap;
  </script>
</body>
</html>
