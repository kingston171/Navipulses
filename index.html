<!DOCTYPE html>
<html lang="en" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WazePulse - Live Navigation & Traffic Alerts</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        waze: {
                            blue: '#33ccff',
                            darkblue: '#0099ff',
                            green: '#00d084',
                            red: '#ff3b30',
                            orange: '#ff9500',
                            yellow: '#ffcc00',
                            purple: '#af52de',
                            dark: '#0f172a',
                            card: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Leaflet CSS & JS (Ultra-stable, bulletproof fallback map engine) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            background-color: #0f172a;
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            bottom: 0;
            z-index: 1;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.4);
            border-radius: 9999px;
        }

        /* Leaflet custom tiles dark tint mode support */
        .dark .leaflet-tile-pane {
            filter: brightness(0.75) contrast(1.1) invert(0.9) hue-rotate(180deg);
        }

        /* Waze Pulsating Car Marker */
        .waze-car-icon-container {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .waze-car-icon {
            width: 38px;
            height: 38px;
            background: #33ccff;
            border: 3.5px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 22px rgba(51, 204, 255, 0.9), 0 4px 12px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 16px;
            position: relative;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes waze-pulse {
            0% { box-shadow: 0 0 0 0 rgba(51, 204, 255, 0.7); }
            70% { box-shadow: 0 0 0 24px rgba(51, 204, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(51, 204, 255, 0); }
        }
        .pulsing-waze {
            animation: waze-pulse 2.2s infinite;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .map-control-btn {
            @apply flex items-center justify-center w-12 h-12 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 rounded-2xl shadow-xl border border-slate-200/80 dark:border-slate-700/80 active:scale-95 transition-all duration-150 hover:bg-slate-50 dark:hover:bg-slate-700;
        }

        .hazard-marker-container {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            border: 2px solid #ffffff;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 dark:text-slate-100 antialiased h-full w-full relative overflow-hidden flex flex-col">

    <!-- MAP CONTAINER -->
    <div id="map"></div>

    <!-- MAIN SEARCH & ROUTE CONTROLS PANEL -->
    <div id="sidebar-container" class="absolute top-4 left-4 z-20 w-full max-w-md pointer-events-none px-2 sm:px-0">
        
        <!-- Search & Settings Box -->
        <div class="glass-panel rounded-3xl shadow-2xl border border-slate-200/60 dark:border-slate-800/80 pointer-events-auto p-4 transition-all duration-300 transform" id="search-card">
            
            <!-- App Branding Header -->
            <div class="flex items-center justify-between mb-3.5 px-1">
                <div class="flex items-center gap-2.5">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-waze-darkblue via-waze-blue to-cyan-400 flex items-center justify-center text-white shadow-lg shadow-waze-blue/40">
                        <i class="fa-solid fa-navigation text-xl"></i>
                    </div>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <h1 class="font-black text-slate-900 dark:text-white leading-none text-xl tracking-tight">Waze<span class="text-waze-blue">Pulse</span></h1>
                            <span class="bg-waze-blue/20 text-waze-darkblue dark:text-waze-blue text-[10px] font-extrabold px-1.5 py-0.5 rounded-md uppercase tracking-wider">Live</span>
                        </div>
                        <span class="text-[11px] font-semibold text-slate-400">Turn-by-Turn Navigation</span>
                    </div>
                </div>
                
                <div class="flex items-center gap-1.5">
                    <button id="btn-theme-toggle" title="Toggle Light/Dark Theme" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                        <i class="fa-solid fa-moon text-sm dark:hidden"></i>
                        <i class="fa-solid fa-sun text-sm hidden dark:block"></i>
                    </button>
                    <button id="btn-voice-toggle" title="Mute/Unmute Voice Guidance" class="w-8 h-8 rounded-full flex items-center justify-center text-waze-blue bg-waze-blue/10 dark:bg-slate-800 hover:bg-waze-blue/20 transition">
                        <i class="fa-solid fa-volume-high text-sm" id="voice-icon"></i>
                    </button>
                </div>
            </div>

            <!-- Inputs for Origin and Destination -->
            <div class="space-y-2 relative">
                <!-- Current / Start Location -->
                <div class="relative flex items-center">
                    <span class="absolute left-3.5 text-waze-green text-sm">
                        <i class="fa-solid fa-circle-dot"></i>
                    </span>
                    <input type="text" id="input-origin" placeholder="Current Location" class="w-full bg-slate-100 dark:bg-slate-800/90 text-slate-900 dark:text-slate-100 text-sm rounded-2xl pl-10 pr-9 py-2.5 outline-none border border-transparent focus:border-waze-blue transition-all font-semibold placeholder-slate-400 dark:placeholder-slate-500" value="My Location">
                    <button id="clear-origin" class="absolute right-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hidden">
                        <i class="fa-solid fa-circle-xmark text-sm"></i>
                    </button>
                </div>

                <!-- Destination Input -->
                <div class="relative flex items-center">
                    <span class="absolute left-3.5 text-waze-red text-sm">
                        <i class="fa-solid fa-location-dot"></i>
                    </span>
                    <input type="text" id="input-destination" placeholder="Where to? Type address or tap map..." class="w-full bg-slate-100 dark:bg-slate-800/90 text-slate-900 dark:text-slate-100 text-sm rounded-2xl pl-10 pr-9 py-2.5 outline-none border border-transparent focus:border-waze-blue transition-all font-semibold placeholder-slate-400 dark:placeholder-slate-500">
                    <button id="clear-destination" class="absolute right-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hidden">
                        <i class="fa-solid fa-circle-xmark text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Geocoding Autocomplete Results -->
            <div id="autocomplete-list" class="mt-2 max-h-56 overflow-y-auto rounded-2xl bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700/60 shadow-2xl hidden">
            </div>

            <!-- Route Options & Mode Selector -->
            <div id="travel-options" class="flex items-center justify-between mt-3 pt-3 border-t border-slate-200/60 dark:border-slate-800/80">
                <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800/80 p-1 rounded-xl">
                    <button class="travel-mode-btn active px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all bg-white dark:bg-slate-700 text-waze-blue shadow-sm" data-mode="auto">
                        <i class="fa-solid fa-car"></i> Drive
                    </button>
                    <button class="travel-mode-btn px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all text-slate-500 dark:text-slate-400" data-mode="bicycle">
                        <i class="fa-solid fa-bicycle"></i> Bike
                    </button>
                    <button class="travel-mode-btn px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all text-slate-500 dark:text-slate-400" data-mode="pedestrian">
                        <i class="fa-solid fa-person-walking"></i> Walk
                    </button>
                </div>

                <button id="btn-get-directions" class="bg-gradient-to-r from-waze-blue to-waze-darkblue hover:opacity-95 text-white font-extrabold px-4 py-2 rounded-xl text-xs shadow-lg shadow-waze-blue/30 active:scale-95 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-route"></i> Route
                </button>
            </div>
        </div>

        <!-- Route Summary Card -->
        <div id="route-card" class="glass-panel rounded-3xl shadow-2xl border border-slate-200/60 dark:border-slate-800/80 pointer-events-auto p-4 mt-3 transition-all duration-300 hidden">
            <div class="flex items-start justify-between">
                <div>
                    <div class="flex items-center gap-2">
                        <span id="route-time" class="text-3xl font-black text-waze-green">-- min</span>
                        <span id="route-distance" class="text-sm font-bold text-slate-500 dark:text-slate-400">(-- km)</span>
                    </div>
                    <p id="route-via" class="text-xs font-semibold text-slate-500 dark:text-slate-400 mt-0.5">Fastest Route • WazePulse Live Nav</p>
                </div>
                <button id="btn-close-route" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Start Drive / Demo Drive Buttons -->
            <div class="grid grid-cols-2 gap-2.5 mt-4">
                <button id="btn-start-navigation" class="bg-waze-green hover:bg-emerald-600 text-white font-black py-3 px-4 rounded-2xl shadow-lg shadow-waze-green/30 flex items-center justify-center gap-2 text-sm active:scale-95 transition">
                    <i class="fa-solid fa-location-arrow"></i> Start Drive
                </button>
                <button id="btn-simulate-navigation" class="bg-waze-blue hover:bg-waze-darkblue text-white font-black py-3 px-4 rounded-2xl shadow-lg shadow-waze-blue/30 flex items-center justify-center gap-2 text-sm active:scale-95 transition">
                    <i class="fa-solid fa-play"></i> Demo Drive
                </button>
            </div>

            <!-- Maneuvers List Dropdown -->
            <button id="btn-toggle-maneuvers" class="w-full mt-3 pt-2.5 border-t border-slate-200/60 dark:border-slate-800/80 flex items-center justify-between text-xs font-extrabold text-slate-500 dark:text-slate-400 hover:text-waze-blue">
                <span><i class="fa-solid fa-list-ol mr-1.5"></i> Step-by-Step Directions</span>
                <i class="fa-solid fa-chevron-down transition-transform duration-200" id="maneuver-chevron"></i>
            </button>

            <div id="maneuvers-container" class="mt-2 max-h-48 overflow-y-auto space-y-2 pr-1 hidden">
            </div>
        </div>
    </div>

    <!-- FLOATING MAP CONTROLS -->
    <div class="absolute right-4 top-4 z-20 flex flex-col gap-3 pointer-events-auto">
        <button id="btn-recenter" title="Recenter Location" class="map-control-btn">
            <i class="fa-solid fa-crosshairs text-xl text-slate-700 dark:text-slate-200"></i>
        </button>

        <!-- WAZE HAZARD REPORT BUTTON -->
        <button id="btn-report-alert" title="Report Hazard" class="map-control-btn bg-gradient-to-tr from-waze-orange via-amber-400 to-yellow-400 border-none shadow-xl shadow-waze-orange/40 active:scale-90 transition-transform">
            <i class="fa-solid fa-triangle-exclamation text-2xl text-white"></i>
        </button>
    </div>

    <!-- LIVE NAV HUD -->
    <div id="nav-hud" class="absolute inset-x-0 top-0 z-30 pointer-events-none p-4 flex flex-col justify-between h-full hidden">
        <!-- Top Maneuver Header -->
        <div class="pointer-events-auto max-w-lg mx-auto w-full glass-panel bg-slate-900/95 dark:bg-slate-950/95 text-white rounded-3xl shadow-2xl border border-slate-700/80 p-4 transform transition-all duration-300">
            <div class="flex items-center gap-4">
                <div id="nav-maneuver-icon-container" class="w-16 h-16 rounded-2xl bg-waze-blue flex items-center justify-center text-white text-3xl shadow-xl shadow-waze-blue/40 shrink-0">
                    <i id="nav-maneuver-icon" class="fa-solid fa-arrow-up"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div id="nav-distance-next" class="text-3xl font-black tracking-tight text-waze-blue">300 m</div>
                    <div id="nav-street-next" class="text-lg font-bold truncate text-slate-100">Main Highway</div>
                    <div id="nav-then-maneuver" class="text-xs font-semibold text-slate-400 truncate mt-0.5">Follow live navigation instructions</div>
                </div>
            </div>
        </div>

        <!-- Bottom Speedometer & Trip Info Bar -->
        <div class="pointer-events-auto max-w-lg mx-auto w-full glass-panel rounded-3xl shadow-2xl border border-slate-200/60 dark:border-slate-800 p-4 mb-2">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-3">
                    <div id="speedometer-box" class="w-14 h-14 rounded-2xl bg-slate-100 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 flex flex-col items-center justify-center shadow-inner">
                        <span id="nav-speed" class="text-lg font-black text-slate-900 dark:text-slate-100 leading-none">0</span>
                        <span class="text-[9px] font-extrabold text-slate-400 uppercase tracking-wider">km/h</span>
                    </div>

                    <div class="w-10 h-10 rounded-full border-2 border-waze-red bg-white dark:bg-slate-900 flex flex-col items-center justify-center shadow-md">
                        <span class="text-[9px] font-bold text-slate-400 leading-none">LIMIT</span>
                        <span class="text-xs font-black text-slate-900 dark:text-white leading-none">80</span>
                    </div>

                    <div>
                        <div id="nav-eta" class="text-2xl font-black text-waze-green leading-tight">12:45 PM</div>
                        <div class="flex items-center gap-2 text-xs font-bold text-slate-500 dark:text-slate-400">
                            <span id="nav-remaining-time">14 min</span>
                            <span>•</span>
                            <span id="nav-remaining-dist">5.2 km</span>
                        </div>
                    </div>
                </div>

                <button id="btn-end-navigation" class="w-13 h-13 px-4 py-3 rounded-2xl bg-waze-red hover:bg-rose-600 text-white shadow-lg shadow-waze-red/40 flex items-center justify-center text-xl font-black active:scale-95 transition" title="End Navigation">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="w-full bg-slate-200 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden">
                <div id="nav-progress-bar" class="bg-gradient-to-r from-waze-blue via-waze-green to-emerald-400 h-full w-0 transition-all duration-300"></div>
            </div>
        </div>
    </div>

    <!-- WAZE COMMUNITY REPORT MODAL -->
    <div id="report-modal" class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-md flex items-end sm:items-center justify-center p-4 hidden transition-opacity duration-200">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-5 shadow-2xl border border-slate-200 dark:border-slate-700 transform transition-all">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-full bg-waze-orange/20 text-waze-orange flex items-center justify-center">
                        <i class="fa-solid fa-bullhorn text-sm"></i>
                    </div>
                    <h3 class="font-black text-base text-slate-900 dark:text-white">Report Road Hazard</h3>
                </div>
                <button id="btn-close-report" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="grid grid-cols-2 gap-3 mb-4">
                <button class="report-item-btn flex flex-col items-center p-3.5 rounded-2xl bg-blue-50 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-800/50 hover:scale-105 active:scale-95 transition" data-type="Police Trap" data-icon="fa-shield-halved" data-color="#2563eb">
                    <i class="fa-solid fa-shield-halved text-blue-500 text-3xl mb-1.5"></i>
                    <span class="text-xs font-extrabold text-slate-800 dark:text-slate-200">Police Trap</span>
                </button>
                <button class="report-item-btn flex flex-col items-center p-3.5 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/50 hover:scale-105 active:scale-95 transition" data-type="Traffic Jam" data-icon="fa-car-burst" data-color="#f59e0b">
                    <i class="fa-solid fa-car-burst text-amber-500 text-3xl mb-1.5"></i>
                    <span class="text-xs font-extrabold text-slate-800 dark:text-slate-200">Traffic Jam</span>
                </button>
                <button class="report-item-btn flex flex-col items-center p-3.5 rounded-2xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800/50 hover:scale-105 active:scale-95 transition" data-type="Crash" data-icon="fa-car-on-fire" data-color="#e11d48">
                    <i class="fa-solid fa-car-on-fire text-rose-500 text-3xl mb-1.5"></i>
                    <span class="text-xs font-extrabold text-slate-800 dark:text-slate-200">Crash</span>
                </button>
                <button class="report-item-btn flex flex-col items-center p-3.5 rounded-2xl bg-purple-50 dark:bg-purple-950/40 border border-purple-200 dark:border-purple-800/50 hover:scale-105 active:scale-95 transition" data-type="Speed Camera" data-icon="fa-camera" data-color="#9333ea">
                    <i class="fa-solid fa-camera text-purple-500 text-3xl mb-1.5"></i>
                    <span class="text-xs font-extrabold text-slate-800 dark:text-slate-200">Speed Cam</span>
                </button>
            </div>
            <p class="text-[11px] text-center font-semibold text-slate-400">Broadcasted to all nearby WazePulse drivers instantly.</p>
        </div>
    </div>

    <!-- TOAST FEEDBACK NOTIFICATION -->
    <div id="toast-container" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 transform translate-y-4">
        <div id="toast-content" class="bg-slate-900 text-white dark:bg-white dark:text-slate-900 text-xs font-extrabold px-4 py-3 rounded-full shadow-2xl flex items-center gap-2.5">
            <i id="toast-icon" class="fa-solid fa-circle-check text-waze-green text-sm"></i>
            <span id="toast-message">Notification message</span>
        </div>
    </div>

    <!-- MAIN JAVASCRIPT LOGIC -->
    <script>
        const PHOTON_GEOCODE_URL = 'https://photon.komoot.io/api/';
        const PHOTON_REVERSE_URL = 'https://photon.komoot.io/reverse';
        const OSRM_ROUTE_URL = 'https://router.project-osrm.org/route/v1/';

        const state = {
            map: null,
            userLocation: [14.5547, 121.0223], // Leaflet [lat, lng] format
            origin: null,
            destination: null,
            currentRouteCoords: [], // array of [lat, lng]
            maneuvers: [],
            userMarker: null,
            destinationMarker: null,
            routePolyline: null,
            isNavigating: false,
            isSimulating: false,
            simulationInterval: null,
            simStepIndex: 0,
            voiceEnabled: true,
            travelMode: 'driving',
            speechSynth: window.speechSynthesis,
            lastSpokenStepIndex: -1
        };

        window.onload = () => {
            initLeafletMap();
            initEventListeners();
            getUserLocation();
        };

        function initLeafletMap() {
            try {
                // Initialize Leaflet map
                state.map = L.map('map', {
                    zoomControl: false,
                    attributionControl: false
                }).setView(state.userLocation, 14);

                // Multiple high-availability basemap fallback tile layers
                const esriWorldStreetMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                    maxZoom: 19
                });

                const cartoVoyager = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                    maxZoom: 19,
                    subdomains: 'abcd'
                });

                const osmStandard = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19
                });

                // Add primary tile layer with automatic failover fallback
                esriWorldStreetMap.addTo(state.map);

                esriWorldStreetMap.on('tileerror', () => {
                    if (!state.map.hasLayer(cartoVoyager)) {
                        cartoVoyager.addTo(state.map);
                    }
                });

                cartoVoyager.on('tileerror', () => {
                    if (!state.map.hasLayer(osmStandard)) {
                        osmStandard.addTo(state.map);
                    }
                });

                // Add scale control
                L.control.scale({ position: 'bottomright' }).addTo(state.map);

                setupUserMarker();

                // Map tap to set destination
                state.map.on('click', (e) => {
                    if (state.isNavigating) return;
                    const { lat, lng } = e.latlng;
                    reverseGeocode(lat, lng, (placeName) => {
                        setDestination({ lat, lng, name: placeName });
                        showToast(`Destination set: ${placeName}`);
                    });
                });

            } catch (err) {
                console.error('Error initializing Leaflet map:', err);
            }
        }

        function setupUserMarker() {
            const carIcon = L.divIcon({
                className: 'waze-car-icon-container',
                html: '<div class="waze-car-icon pulsing-waze"><i class="fa-solid fa-location-arrow"></i></div>',
                iconSize: [42, 42],
                iconAnchor: [21, 21]
            });

            state.userMarker = L.marker(state.userLocation, { icon: carIcon }).addTo(state.map);
        }

        function getUserLocation() {
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const { latitude, longitude } = pos.coords;
                        state.userLocation = [latitude, longitude];

                        if (state.userMarker) {
                            state.userMarker.setLatLng(state.userLocation);
                        }
                        state.map.setView(state.userLocation, 15);

                        if (!state.origin || state.origin.isGPS) {
                            state.origin = { lat: latitude, lng: longitude, name: 'My Location', isGPS: true };
                        }
                    },
                    () => {
                        state.origin = { lat: state.userLocation[0], lng: state.userLocation[1], name: 'My Location', isGPS: true };
                    },
                    { enableHighAccuracy: true, timeout: 8000 }
                );
            } else {
                state.origin = { lat: state.userLocation[0], lng: state.userLocation[1], name: 'My Location', isGPS: true };
            }
        }

        let searchTimeout = null;
        function handleSearchInput(inputEl, query) {
            clearTimeout(searchTimeout);
            if (!query || query.length < 2) {
                hideAutocomplete();
                return;
            }

            searchTimeout = setTimeout(() => {
                const url = `${PHOTON_GEOCODE_URL}?q=${encodeURIComponent(query)}&limit=5&lon=${state.userLocation[1]}&lat=${state.userLocation[0]}`;
                fetch(url)
                    .then(res => res.json())
                    .then(data => renderAutocomplete(inputEl, data.features || []))
                    .catch(err => console.error('Geocoding error:', err));
            }, 250);
        }

        function renderAutocomplete(targetInput, features) {
            const listContainer = document.getElementById('autocomplete-list');
            listContainer.innerHTML = '';

            if (features.length === 0) {
                listContainer.classList.add('hidden');
                return;
            }

            features.forEach(feat => {
                const props = feat.properties;
                const coords = feat.geometry.coordinates; // [lng, lat]
                const name = props.name || props.street || 'Selected Location';
                const subtitle = [props.city, props.state, props.country].filter(Boolean).join(', ');

                const item = document.createElement('div');
                item.className = 'p-3 border-b border-slate-100 dark:border-slate-700/50 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer flex items-center gap-3 transition';
                item.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-waze-blue/15 text-waze-blue flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-location-dot text-sm"></i>
                    </div>
                    <div class="min-w-0 flex-1">
                        <div class="text-xs font-bold text-slate-800 dark:text-slate-100 truncate">${name}</div>
                        <div class="text-[11px] text-slate-400 truncate">${subtitle}</div>
                    </div>
                `;

                item.onclick = () => {
                    const selected = { lat: coords[1], lng: coords[0], name: name };
                    if (targetInput.id === 'input-origin') {
                        state.origin = selected;
                        targetInput.value = name;
                    } else {
                        setDestination(selected);
                    }
                    hideAutocomplete();
                };

                listContainer.appendChild(item);
            });

            listContainer.classList.remove('hidden');
        }

        function hideAutocomplete() {
            document.getElementById('autocomplete-list').classList.add('hidden');
        }

        function reverseGeocode(lat, lng, callback) {
            fetch(`${PHOTON_REVERSE_URL}?lat=${lat}&lon=${lng}`)
                .then(res => res.json())
                .then(data => {
                    if (data.features && data.features.length > 0) {
                        const props = data.features[0].properties;
                        const name = props.name || props.street || `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                        callback(name);
                    } else {
                        callback(`${lat.toFixed(4)}, ${lng.toFixed(4)}`);
                    }
                })
                .catch(() => callback(`${lat.toFixed(4)}, ${lng.toFixed(4)}`));
        }

        function setDestination(destObj) {
            state.destination = destObj;
            document.getElementById('input-destination').value = destObj.name;
            document.getElementById('clear-destination').classList.remove('hidden');

            if (state.destinationMarker) state.map.removeLayer(state.destinationMarker);

            const destIcon = L.divIcon({
                className: 'custom-dest-icon',
                html: '<div class="w-9 h-9 rounded-full bg-waze-red text-white flex items-center justify-center shadow-xl border-2 border-white"><i class="fa-solid fa-flag-checkered text-sm"></i></div>',
                iconSize: [36, 36],
                iconAnchor: [18, 36]
            });

            state.destinationMarker = L.marker([destObj.lat, destObj.lng], { icon: destIcon }).addTo(state.map);

            calculateRoute();
        }

        function calculateRoute() {
            if (!state.origin || !state.destination) {
                showToast('Please set both origin and destination');
                return;
            }

            const profileMap = { 'auto': 'driving', 'bicycle': 'bike', 'pedestrian': 'foot' };
            const profile = profileMap[state.travelMode] || 'driving';
            const url = `${OSRM_ROUTE_URL}${profile}/${state.origin.lng},${state.origin.lat};${state.destination.lng},${state.destination.lat}?overview=full&geometries=geojson&steps=true`;

            showToast('Calculating best route...');

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                        processOSRMResponse(data.routes[0]);
                    } else {
                        generateFallbackRoute();
                    }
                })
                .catch(() => generateFallbackRoute());
        }

        function processOSRMResponse(route) {
            // OSRM geometry is [lng, lat], convert to Leaflet [lat, lng]
            const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
            state.currentRouteCoords = coords;

            const steps = [];
            if (route.legs && route.legs[0] && route.legs[0].steps) {
                route.legs[0].steps.forEach(step => {
                    steps.push({
                        instruction: step.maneuver.instruction || (step.name ? `Turn onto ${step.name}` : 'Continue straight'),
                        length: (step.distance / 1000),
                        type: step.maneuver.type,
                        modifier: step.maneuver.modifier,
                        street_names: [step.name || 'Main Road']
                    });
                });
            }

            state.maneuvers = steps.length > 0 ? steps : [
                { instruction: `Proceed to ${state.destination.name}`, length: (route.distance / 1000), type: 'straight', street_names: [state.destination.name] }
            ];

            updateRouteOnMap(coords);

            const timeMin = Math.max(1, Math.round(route.duration / 60));
            const distKm = (route.distance / 1000).toFixed(1);

            document.getElementById('route-time').innerText = `${timeMin} min`;
            document.getElementById('route-distance').innerText = `(${distKm} km)`;
            document.getElementById('route-via').innerText = `Via ${route.legs[0]?.summary || 'Primary Highway'}`;
            document.getElementById('route-card').classList.remove('hidden');

            renderManeuversList(state.maneuvers);
        }

        function generateFallbackRoute() {
            const start = [state.origin.lat, state.origin.lng];
            const end = [state.destination.lat, state.destination.lng];

            const coords = [start];
            const stepsCount = 12;
            for (let i = 1; i < stepsCount; i++) {
                const ratio = i / stepsCount;
                coords.push([
                    start[0] + (end[0] - start[0]) * ratio,
                    start[1] + (end[1] - start[1]) * ratio
                ]);
            }
            coords.push(end);

            state.currentRouteCoords = coords;
            state.maneuvers = [
                { instruction: `Head toward ${state.destination.name}`, length: 1.2, type: 'straight', street_names: ['Main Avenue'] },
                { instruction: `Arrive at destination`, length: 0.1, type: 'arrive', street_names: [state.destination.name] }
            ];

            updateRouteOnMap(coords);

            document.getElementById('route-time').innerText = '8 min';
            document.getElementById('route-distance').innerText = '(2.8 km)';
            document.getElementById('route-via').innerText = 'Optimal Direct Route';
            document.getElementById('route-card').classList.remove('hidden');

            renderManeuversList(state.maneuvers);
        }

        function updateRouteOnMap(coords) {
            if (state.routePolyline) {
                state.map.removeLayer(state.routePolyline);
            }

            state.routePolyline = L.polyline(coords, {
                color: '#33ccff',
                weight: 7,
                opacity: 0.95,
                lineCap: 'round',
                lineJoin: 'round'
            }).addTo(state.map);

            state.map.fitBounds(state.routePolyline.getBounds(), { padding: [50, 50] });
        }

        function renderManeuversList(maneuvers) {
            const container = document.getElementById('maneuvers-container');
            container.innerHTML = '';

            maneuvers.forEach((m) => {
                const iconClass = getManeuverIcon(m.type, m.modifier);
                const step = document.createElement('div');
                step.className = 'flex items-center gap-3 p-2.5 rounded-2xl bg-slate-50 dark:bg-slate-800/80 border border-slate-100 dark:border-slate-700/50 text-xs';
                step.innerHTML = `
                    <div class="w-8 h-8 rounded-xl bg-waze-blue text-white flex items-center justify-center shrink-0 font-bold shadow-md">
                        <i class="fa-solid ${iconClass}"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-extrabold text-slate-800 dark:text-slate-100 truncate">${m.instruction}</div>
                        <div class="text-[10px] font-semibold text-slate-400">${(m.length * 1000).toFixed(0)} meters</div>
                    </div>
                `;
                container.appendChild(step);
            });
        }

        function getManeuverIcon(type, modifier) {
            if (modifier && modifier.includes('left')) return 'fa-arrow-turn-down -rotate-90';
            if (modifier && modifier.includes('right')) return 'fa-arrow-turn-up rotate-90';
            if (type === 'arrive') return 'fa-flag-checkered';
            return 'fa-arrow-up';
        }

        function startNavigation(isSimulation = false) {
            if (!state.currentRouteCoords || state.currentRouteCoords.length === 0) return;

            state.isNavigating = true;
            state.isSimulating = isSimulation;
            state.simStepIndex = 0;
            state.lastSpokenStepIndex = -1;

            document.getElementById('search-card').classList.add('hidden');
            document.getElementById('route-card').classList.add('hidden');
            document.getElementById('nav-hud').classList.remove('hidden');

            state.map.setZoom(17);

            speakVoicePrompt('Navigation started. Follow highlighted route.');

            if (isSimulation) {
                runSimulationLoop();
                showToast('Waze Demo Drive Running...');
            } else {
                showToast('Turn-by-turn Navigation Active');
            }
        }

        function stopNavigation() {
            state.isNavigating = false;
            state.isSimulating = false;
            if (state.simulationInterval) clearInterval(state.simulationInterval);

            document.getElementById('nav-hud').classList.add('hidden');
            document.getElementById('search-card').classList.remove('hidden');
            document.getElementById('route-card').classList.remove('hidden');

            state.map.setZoom(14);
            if (state.speechSynth) state.speechSynth.cancel();

            showToast('Navigation ended');
        }

        function runSimulationLoop() {
            const coords = state.currentRouteCoords;
            if (!coords || coords.length === 0) return;

            state.simulationInterval = setInterval(() => {
                if (!state.isNavigating) return;

                if (state.simStepIndex >= coords.length) {
                    stopNavigation();
                    speakVoicePrompt('You have arrived at your destination!');
                    showToast('Destination Reached!');
                    return;
                }

                const currentCoord = coords[state.simStepIndex]; // [lat, lng]
                state.userMarker.setLatLng(currentCoord);
                state.map.panTo(currentCoord, { animate: true, duration: 0.5 });

                updateNavigationHUD(state.simStepIndex, coords.length);
                state.simStepIndex++;
            }, 700);
        }

        function updateNavigationHUD(currentIndex, totalSteps) {
            const progress = (currentIndex / totalSteps) * 100;
            document.getElementById('nav-progress-bar').style.width = `${progress}%`;

            const speed = Math.floor(Math.random() * 15) + 60;
            document.getElementById('nav-speed').innerText = speed;

            const activeManeuverIdx = Math.min(
                Math.floor((currentIndex / totalSteps) * state.maneuvers.length),
                state.maneuvers.length - 1
            );
            const maneuver = state.maneuvers[activeManeuverIdx];

            if (maneuver) {
                document.getElementById('nav-street-next').innerText = maneuver.street_names?.[0] || maneuver.instruction;
                document.getElementById('nav-distance-next').innerText = `${Math.round(maneuver.length * 1000)} m`;

                const iconClass = getManeuverIcon(maneuver.type, maneuver.modifier);
                document.getElementById('nav-maneuver-icon').className = `fa-solid ${iconClass}`;

                if (activeManeuverIdx !== state.lastSpokenStepIndex) {
                    speakVoicePrompt(maneuver.instruction);
                    state.lastSpokenStepIndex = activeManeuverIdx;
                }
            }

            const now = new Date();
            now.setMinutes(now.getMinutes() + 10);
            document.getElementById('nav-eta').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function speakVoicePrompt(text) {
            if (!state.voiceEnabled || !state.speechSynth) return;
            state.speechSynth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            state.speechSynth.speak(utterance);
        }

        function initEventListeners() {
            const destInput = document.getElementById('input-destination');
            const origInput = document.getElementById('input-origin');

            destInput.addEventListener('input', (e) => handleSearchInput(destInput, e.target.value));
            origInput.addEventListener('input', (e) => handleSearchInput(origInput, e.target.value));

            document.getElementById('clear-destination').onclick = () => {
                destInput.value = '';
                state.destination = null;
                if (state.destinationMarker) state.map.removeLayer(state.destinationMarker);
                if (state.routePolyline) state.map.removeLayer(state.routePolyline);
                document.getElementById('clear-destination').classList.add('hidden');
                document.getElementById('route-card').classList.add('hidden');
            };

            document.querySelectorAll('.travel-mode-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.travel-mode-btn').forEach(b => {
                        b.classList.remove('active', 'bg-white', 'dark:bg-slate-700', 'text-waze-blue', 'shadow-sm');
                        b.classList.add('text-slate-500');
                    });
                    btn.classList.add('active', 'bg-white', 'dark:bg-slate-700', 'text-waze-blue', 'shadow-sm');
                    btn.classList.remove('text-slate-500');

                    state.travelMode = btn.dataset.mode;
                    if (state.destination) calculateRoute();
                };
            });

            document.getElementById('btn-get-directions').onclick = () => calculateRoute();
            document.getElementById('btn-start-navigation').onclick = () => startNavigation(false);
            document.getElementById('btn-simulate-navigation').onclick = () => startNavigation(true);
            document.getElementById('btn-end-navigation').onclick = () => stopNavigation();

            document.getElementById('btn-close-route').onclick = () => {
                document.getElementById('route-card').classList.add('hidden');
            };

            document.getElementById('btn-recenter').onclick = () => {
                state.map.setView(state.userLocation, 15);
            };

            document.getElementById('btn-theme-toggle').onclick = () => {
                document.documentElement.classList.toggle('dark');
            };

            document.getElementById('btn-voice-toggle').onclick = () => {
                state.voiceEnabled = !state.voiceEnabled;
                const icon = document.getElementById('voice-icon');
                icon.className = state.voiceEnabled ? 'fa-solid fa-volume-high text-sm' : 'fa-solid fa-volume-xmark text-sm';
                showToast(state.voiceEnabled ? 'Voice Guidance Unmuted' : 'Voice Guidance Muted');
            };

            document.getElementById('btn-toggle-maneuvers').onclick = () => {
                const list = document.getElementById('maneuvers-container');
                const chevron = document.getElementById('maneuver-chevron');
                list.classList.toggle('hidden');
                chevron.classList.toggle('rotate-180');
            };

            document.getElementById('btn-report-alert').onclick = () => {
                document.getElementById('report-modal').classList.remove('hidden');
            };
            document.getElementById('btn-close-report').onclick = () => {
                document.getElementById('report-modal').classList.add('hidden');
            };

            document.querySelectorAll('.report-item-btn').forEach(btn => {
                btn.onclick = () => {
                    const alertType = btn.dataset.type;
                    const icon = btn.dataset.icon;
                    const color = btn.dataset.color;
                    addCommunityReportMarker(alertType, icon, color);
                    document.getElementById('report-modal').classList.add('hidden');
                    speakVoicePrompt(`Reported ${alertType} ahead!`);
                    showToast(`Reported ${alertType} ahead! Thank you Wazer.`);
                };
            });
        }

        function addCommunityReportMarker(type, iconClass, bgColor) {
            const hazardIcon = L.divIcon({
                className: 'custom-hazard-icon',
                html: `<div class="hazard-marker-container" style="background-color: ${bgColor};"><i class="fa-solid ${iconClass}"></i></div>`,
                iconSize: [38, 38],
                iconAnchor: [19, 19]
            });

            L.marker(state.userLocation, { icon: hazardIcon })
                .bindPopup(`<b>Waze Alert:</b> ${type}<br><span class="text-xs text-slate-500">Reported live</span>`)
                .addTo(state.map);
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const messageEl = document.getElementById('toast-message');
            messageEl.innerText = msg;

            container.classList.remove('opacity-0', 'translate-y-4');
            container.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                container.classList.remove('opacity-100', 'translate-y-0');
                container.classList.add('opacity-0', 'translate-y-4');
            }, 3000);
        }
    </script>
</body>
</html>
